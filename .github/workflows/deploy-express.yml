name: Deploy Express Backend

on:
  workflow_dispatch:
    inputs:
      stack_name:
        description: "Express CloudFormation stack name"
        required: true
        default: "clouddesk-express"

jobs:
  deploy:
    name: Build image and update EC2
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-2
      AWS_DEFAULT_REGION: us-east-2
      STACK_NAME: ${{ inputs.stack_name }}
      CORS_ORIGIN: https://d1l863cphghqlg.cloudfront.net

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build Express backend
        working-directory: backend-express
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Read stack outputs
        id: stack
        run: |
          output() {
            aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue | [0]" \
              --output text
          }

          echo "deployment_bucket=$(output DeploymentBucketName)" >> "$GITHUB_OUTPUT"
          echo "repository_uri=$(output RepositoryUri)" >> "$GITHUB_OUTPUT"
          echo "build_project=$(output CodeBuildProjectName)" >> "$GITHUB_OUTPUT"
          echo "instance_id=$(output BackendInstanceId)" >> "$GITHUB_OUTPUT"
          echo "health_url=$(output BackendHealthUrl)" >> "$GITHUB_OUTPUT"
          echo "tasks_table=$(output TasksTableName)" >> "$GITHUB_OUTPUT"
          echo "subscriptions_table=$(output SubscriptionTableName)" >> "$GITHUB_OUTPUT"

      - name: Package and upload build source
        env:
          DEPLOYMENT_BUCKET: ${{ steps.stack.outputs.deployment_bucket }}
        run: |
          cd backend-express
          zip -r ../backend-express.zip . \
            -x "node_modules/*" "dist/*" ".env" ".DS_Store"
          cd ..
          aws s3 cp backend-express.zip "s3://$DEPLOYMENT_BUCKET/backend-express.zip"
          aws s3 cp infra-express/deploy-container.sh "s3://$DEPLOYMENT_BUCKET/deploy-container.sh"

      - name: Build and push Docker image
        env:
          BUILD_PROJECT: ${{ steps.stack.outputs.build_project }}
          REPOSITORY_URI: ${{ steps.stack.outputs.repository_uri }}
        run: |
          build_id=$(aws codebuild start-build \
            --project-name "$BUILD_PROJECT" \
            --environment-variables-override \
              name=REPOSITORY_URI,value="$REPOSITORY_URI",type=PLAINTEXT \
              name=IMAGE_TAG,value="$GITHUB_SHA",type=PLAINTEXT \
            --query "build.id" \
            --output text)

          for attempt in $(seq 1 90); do
            status=$(aws codebuild batch-get-builds \
              --ids "$build_id" \
              --query "builds[0].buildStatus" \
              --output text)
            case "$status" in
              SUCCEEDED)
                exit 0
                ;;
              FAILED|FAULT|STOPPED|TIMED_OUT)
                echo "::error::CodeBuild finished with status $status"
                exit 1
                ;;
            esac
            sleep 10
          done

          echo "::error::Timed out waiting for CodeBuild"
          exit 1

      - name: Deploy image through Systems Manager
        env:
          DEPLOYMENT_BUCKET: ${{ steps.stack.outputs.deployment_bucket }}
          INSTANCE_ID: ${{ steps.stack.outputs.instance_id }}
          REPOSITORY_URI: ${{ steps.stack.outputs.repository_uri }}
          TASKS_TABLE: ${{ steps.stack.outputs.tasks_table }}
          SUBSCRIPTIONS_TABLE: ${{ steps.stack.outputs.subscriptions_table }}
          COGNITO_USER_POOL_ID: us-east-2_Xv3FsshOw
          COGNITO_CLIENT_ID: 62nbd5t1j78c6n8bjici33lgdj
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
        run: |
          deploy_command="aws s3 cp s3://$DEPLOYMENT_BUCKET/deploy-container.sh /tmp/deploy-container.sh && chmod +x /tmp/deploy-container.sh && /tmp/deploy-container.sh $REPOSITORY_URI $GITHUB_SHA $AWS_REGION $TASKS_TABLE $SUBSCRIPTIONS_TABLE $COGNITO_USER_POOL_ID $COGNITO_CLIENT_ID $CORS_ORIGIN $DEEPSEEK_API_KEY $PINECONE_API_KEY"
          parameters=$(jq -n --arg command "$deploy_command" '{commands: [$command]}')
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$parameters" \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" || true

          status=$(aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query "Status" \
            --output text)
          if [[ "$status" != "Success" ]]; then
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID"
            exit 1
          fi

      - name: Verify deployed API
        env:
          HEALTH_URL: ${{ steps.stack.outputs.health_url }}
        run: curl --fail --retry 12 --retry-delay 5 --retry-all-errors "$HEALTH_URL"
